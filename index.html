<script id="logic">
/* ============================================================================
   PURE LOGIC — no DOM. Plain data in, plain data out, unit-testable.

   THE HARD PROBLEM THIS SOLVES: professional development is recorded in three
   different units — clock hours, CEUs and college credits — and boards state
   their requirement in only one of them. Every activity is converted to a
   single base unit using conversion factors YOU set, so one total is always
   correct no matter how each course was awarded.
   ========================================================================== */

/* ---------------------------------------------------------------------------
   CONFIGURATION — EDIT FREELY. Renewal requirements, cycle lengths, accepted
   categories and unit conversions are set by your own state or district, differ
   by licence and endorsement, and change. Nothing below states any authority's
   current rules. Confirm every figure against your own renewal page.
   Last reviewed by the author: 2026-09-17.
   --------------------------------------------------------------------------- */
var CRITERIA_REVIEWED = "2026-09-17";

/* The 50 states plus DC. Names only — the numbers are yours to enter. */
var STATES = [
  "Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware",
  "District of Columbia","Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa",
  "Kansas","Kentucky","Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota",
  "Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey",
  "New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon",
  "Pennsylvania","Rhode Island","South Carolina","South Dakota","Tennessee","Texas","Utah",
  "Vermont","Virginia","Washington","West Virginia","Wisconsin","Wyoming"
];

/* Base unit is the clock hour. Factors are editable because they vary. */
var DEFAULT_CONVERSIONS = {
  clockHour: 1,
  ceu: 10,             /* 1 CEU commonly equals 10 clock hours */
  semesterCredit: 15,  /* 1 semester credit commonly equals 15 clock hours */
  quarterCredit: 10    /* 1 quarter credit commonly equals 10 clock hours */
};

var UNITS = [
  { id: "clockHour",      label: "Clock hours" },
  { id: "ceu",            label: "CEUs" },
  { id: "semesterCredit", label: "Semester credits" },
  { id: "quarterCredit",  label: "Quarter credits" }
];

var PD_CATEGORIES = [
  { id: "content",      label: "Content area / subject matter" },
  { id: "pedagogy",     label: "Instructional strategy & pedagogy" },
  { id: "assessment",   label: "Assessment & data" },
  { id: "sped",         label: "Special education & IEP" },
  { id: "ell",          label: "English language learners" },
  { id: "technology",   label: "Educational technology" },
  { id: "classroom",    label: "Classroom management" },
  { id: "literacy",     label: "Literacy & reading" },
  { id: "safety",       label: "Student safety & mandated reporting" },
  { id: "mentalhealth", label: "Student mental health" },
  { id: "equity",       label: "Equity & cultural responsiveness" },
  { id: "leadership",   label: "Leadership & coaching" },
  { id: "coursework",   label: "University coursework" },
  { id: "conference",   label: "Conference or institute" },
  { id: "other",        label: "Other approved activity" }
];

var SUBMISSION_STATES = [
  { id: "notready",  label: "Not ready" },
  { id: "ready",     label: "Ready to submit" },
  { id: "submitted", label: "Submitted" },
  { id: "approved",  label: "Approved" },
  { id: "rejected",  label: "Rejected" }
];

/* ---------- helpers ---------- */
function pad2(n) { return (n < 10 ? "0" : "") + n; }
function toISO(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function parseISO(s) {
  if (!s) return null;
  var p = String(s).split("-");
  if (p.length !== 3) return null;
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return isNaN(d.getTime()) ? null : d;
}
function daysUntil(a, b) {
  var x = parseISO(a), y = parseISO(b);
  if (!x || !y) return null;
  return Math.round((y - x) / 86400000);
}
function addMonths(iso, months) {
  var d = parseISO(iso);
  if (!d) return null;
  var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setMonth(t.getMonth() + months);
  return toISO(t);
}
function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function round1(n) { return Math.round(n * 10) / 10; }
function pct(part, whole) { return whole > 0 ? (part / whole) * 100 : 0; }
function catLabel(id) {
  for (var i = 0; i < PD_CATEGORIES.length; i++) { if (PD_CATEGORIES[i].id === id) return PD_CATEGORIES[i].label; }
  return id || "";
}
function unitLabel(id) {
  for (var i = 0; i < UNITS.length; i++) { if (UNITS[i].id === id) return UNITS[i].label; }
  return id || "";
}
function submissionLabel(id) {
  for (var i = 0; i < SUBMISSION_STATES.length; i++) {
    if (SUBMISSION_STATES[i].id === id) return SUBMISSION_STATES[i].label;
  }
  return "Not ready";
}

/* ---------- THE CONVERSION ENGINE ---------- */

/* One activity, expressed in whatever unit it was awarded in, converted to clock hours. */
function toClockHours(activity, conversions) {
  var c = conversions || DEFAULT_CONVERSIONS;
  var factor = c[activity.unit];
  if (factor === undefined || factor === null) factor = 1;
  return round1(num(activity.amount) * num(factor));
}

function sumClockHours(activities, conversions) {
  var t = 0;
  for (var i = 0; i < activities.length; i++) t += toClockHours(activities[i], conversions);
  return round1(t);
}

/* Activities falling inside one licence's current renewal cycle. */
function activitiesForLicence(activities, licence) {
  var start = licence.cycleStart;
  var end = addMonths(start, num(licence.cycleMonths));
  var out = [];
  for (var i = 0; i < activities.length; i++) {
    var a = activities[i];
    if (!a.date) continue;
    var list = a.licences || [];
    var hit = false;
    for (var j = 0; j < list.length; j++) { if (list[j] === licence.id) hit = true; }
    if (!hit) continue;
    if (a.date >= start && a.date <= end) out.push(a);
  }
  return out;
}

function hoursByCategory(activities, conversions) {
  var map = {};
  for (var i = 0; i < activities.length; i++) {
    var k = activities[i].category || "other";
    map[k] = round1((map[k] || 0) + toClockHours(activities[i], conversions));
  }
  return map;
}

/* THE PER-LICENCE STATUS. */
function licenceStatus(licence, activities, conversions, todayISOstr) {
  var rows = activitiesForLicence(activities, licence);
  var cycleEnd = addMonths(licence.cycleStart, num(licence.cycleMonths));

  var logged = 0, verified = 0, unverified = 0, approved = 0;
  for (var i = 0; i < rows.length; i++) {
    var h = toClockHours(rows[i], conversions);
    logged += h;
    if (rows[i].certificate === "1") verified += h; else unverified += h;
    if (rows[i].submission === "approved") approved += h;
  }
  logged = round1(logged); verified = round1(verified);
  unverified = round1(unverified); approved = round1(approved);

  var need = num(licence.requiredHours);
  var remaining = Math.max(0, need - logged);

  /* category minimums, if the licence sets any */
  var byCat = hoursByCategory(rows, conversions);
  var mins = licence.categoryMins || [];
  var catChecks = [];
  var catsMet = true;
  for (var m = 0; m < mins.length; m++) {
    var have = byCat[mins[m].category] || 0;
    var needCat = num(mins[m].hours);
    var ok = have >= needCat;
    if (!ok) catsMet = false;
    catChecks.push({ category: mins[m].category, label: catLabel(mins[m].category),
                     have: round1(have), need: needCat, ok: ok,
                     percent: needCat > 0 ? Math.min(100, pct(have, needCat)) : 100 });
  }

  var expiry = licence.expiry || cycleEnd;
  var daysLeft = daysUntil(todayISOstr, expiry);
  var monthsLeft = daysLeft === null ? null : daysLeft / 30.44;

  return {
    licenceId: licence.id,
    cycleStart: licence.cycleStart, cycleEnd: cycleEnd, expiry: expiry,
    entries: rows.length,
    logged: logged, verified: verified, unverified: unverified, approved: approved,
    need: need, remaining: round1(remaining),
    byCategory: byCat, categoryChecks: catChecks, categoriesMet: catsMet,
    hoursMet: logged >= need,
    verifiedMet: verified >= need,
    daysLeft: daysLeft,
    expired: daysLeft !== null && daysLeft < 0,
    perMonthNeeded: monthsLeft && monthsLeft > 0 ? round1(remaining / monthsLeft) : null,
    percent: need > 0 ? Math.min(100, pct(logged, need)) : 100,
    verifiedPercent: need > 0 ? Math.min(100, pct(verified, need)) : 100,
    ready: logged >= need && catsMet && unverified === 0
  };
}

/* MONTHLY COMPLETION PLANNER — how many hours a month, and the safe finish date. */
function completionPlan(status, todayISOstr, bufferDays) {
  var buffer = bufferDays === undefined ? 30 : bufferDays;
  if (status.remaining <= 0) {
    return { done: true, perMonth: 0, safeFinishISO: null, monthsAvailable: null, achievable: true };
  }
  var days = status.daysLeft;
  if (days === null) return { done: false, perMonth: null, safeFinishISO: null, monthsAvailable: null, achievable: null };
  var usable = days - buffer;
  if (usable <= 0) {
    return { done: false, perMonth: null, safeFinishISO: null, monthsAvailable: 0, achievable: false };
  }
  var months = usable / 30.44;
  var safe = parseISO(todayISOstr);
  var safeISO = null;
  if (safe) {
    var t = new Date(safe.getFullYear(), safe.getMonth(), safe.getDate());
    t.setDate(t.getDate() + usable);
    safeISO = toISO(t);
  }
  return {
    done: false,
    perMonth: round1(status.remaining / months),
    safeFinishISO: safeISO,
    monthsAvailable: Math.round(months * 10) / 10,
    achievable: true
  };
}

/* AUDIT & PROOF CHECKLIST — a traffic-light readiness score. */
function auditChecklist(licences, activities, conversions, todayISOstr) {
  var items = [];
  var push = function (label, ok, detail) { items.push({ label: label, ok: ok, detail: detail }); };

  var noCert = 0, noProvider = 0, unassigned = 0, rejected = 0;
  for (var i = 0; i < activities.length; i++) {
    var a = activities[i];
    if (a.certificate !== "1") noCert++;
    if (!a.provider) noProvider++;
    if (!a.licences || !a.licences.length) unassigned++;
    if (a.submission === "rejected") rejected++;
  }

  push("Every activity has a certificate on file", noCert === 0,
       noCert === 0 ? "All certificates held" : noCert + " without a certificate");
  push("Every activity names a provider", noProvider === 0,
       noProvider === 0 ? "All providers recorded" : noProvider + " missing a provider");
  push("Every activity is assigned to a licence", unassigned === 0,
       unassigned === 0 ? "All assigned" : unassigned + " counting toward nothing");
  push("No activity rejected by the district", rejected === 0,
       rejected === 0 ? "None rejected" : rejected + " rejected, needs replacing");

  var shortLic = 0, expiredLic = 0, catShort = 0;
  for (var j = 0; j < licences.length; j++) {
    var s = licenceStatus(licences[j], activities, conversions, todayISOstr);
    if (!s.hoursMet) shortLic++;
    if (s.expired) expiredLic++;
    if (!s.categoriesMet) catShort++;
  }
  push("Every licence has its required hours", shortLic === 0,
       shortLic === 0 ? "All licences complete" : shortLic + " licence(s) short");
  push("Every category minimum is met", catShort === 0,
       catShort === 0 ? "All category minimums met" : catShort + " licence(s) short on a category");
  push("No licence has expired", expiredLic === 0,
       expiredLic === 0 ? "All current" : expiredLic + " expired");

  var ok = 0;
  for (var k = 0; k < items.length; k++) { if (items[k].ok) ok++; }
  var score = items.length ? Math.round(pct(ok, items.length)) : 0;
  var lamp = score === 100 ? "g" : (score >= 75 ? "y" : (score >= 50 ? "o" : "r"));
  var verdict = score === 100 ? "Ready to submit"
    : (score >= 75 ? "Almost ready" : (score >= 50 ? "Missing documents" : "Critical risk"));

  return { items: items, ok: ok, total: items.length, score: score, lamp: lamp, verdict: verdict };
}

/* Everything with an expiry, soonest first. */
function renewalCalendar(licences, todayISOstr) {
  var items = [];
  for (var i = 0; i < licences.length; i++) {
    var L = licences[i];
    var exp = L.expiry || addMonths(L.cycleStart, num(L.cycleMonths));
    items.push({ id: L.id, label: L.name, detail: L.state + (L.number ? " · " + L.number : ""),
                 date: exp, daysLeft: daysUntil(todayISOstr, exp) });
  }
  items.sort(function (a, b) {
    if (a.date === b.date) return 0;
    if (!a.date) return 1;
    if (!b.date) return -1;
    return a.date < b.date ? -1 : 1;
  });
  return items;
}

function overallReadiness(licences, activities, conversions, todayISOstr) {
  var ready = 0, statuses = [];
  for (var i = 0; i < licences.length; i++) {
    var s = licenceStatus(licences[i], activities, conversions, todayISOstr);
    statuses.push(s);
    if (s.ready) ready++;
  }
  return { statuses: statuses, ready: ready, total: licences.length,
           score: licences.length ? Math.round(pct(ready, licences.length)) : 0 };
}

function toCSV(rows) {
  var out = [];
  for (var i = 0; i < rows.length; i++) {
    var line = [];
    for (var j = 0; j < rows[i].length; j++) {
      var cell = rows[i][j] === null || rows[i][j] === undefined ? "" : String(rows[i][j]);
      line.push('"' + cell.replace(/"/g, '""') + '"');
    }
    out.push(line.join(","));
  }
  return out.join("\n");
}
</script>

<script id="uiapp">

var STATE = null, VIEW = "dash", MODAL = null, EDIT = null, PACKLIC = null;

var TABS = [
  ["dash", "Dashboard"], ["pd", "PD Log"], ["licences", "Licences"],
  ["requirements", "Requirements"], ["district", "District"], ["vault", "Certificates"],
  ["plan", "Monthly Plan"], ["audit", "Audit & Reports"]
];

function uid() { return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { STATE = JSON.parse(raw); }
  } catch (e) { STATE = null; }
  if (!STATE || !STATE.licences) STATE = seed();
  if (!STATE.settings) STATE.settings = { dark: "0" };
  if (!STATE.activities) STATE.activities = [];
  if (!STATE.conversions) STATE.conversions = blank().conversions;
  if (!STATE.district) STATE.district = blank().district;
  if (!STATE.profile) STATE.profile = blank().profile;
  document.documentElement.setAttribute("data-dark", STATE.settings.dark === "1" ? "1" : "0");
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(STATE)); } catch (e) { } }

function el(tag, attrs, html) {
  var a = "";
  if (attrs) {
    for (var k in attrs) {
      if (attrs[k] === null || attrs[k] === undefined || attrs[k] === "") continue;
      a += " " + k + '="' + String(attrs[k]).replace(/"/g, "&quot;") + '"';
    }
  }
  return "<" + tag + a + ">" + (html === undefined || html === null ? "" : html) + "</" + tag + ">";
}

function statusPill(s) {
  if (s.expired) return el("span", { "class": "pill bad" }, "Expired");

  return el("span", { "class": "pill amber" }, "In progress");
}

function listCard(title, rows, rowFn, emptyMsg, headHtml) {
  var body;
  if (!rows.length) {
    body = el("div", { "class": "empty" }, el("b", {}, "Nothing here yet") + esc(emptyMsg));

    body = el("div", { "class": "tblwrap" }, el("table", {}, (headHtml || "") + trs));
  }
  return el("div", { "class": "card" }, el("h3", {}, esc(title)) + body);

function viewPlan() {
  var ov = overallReadiness(STATE.licences, STATE.activities, STATE.conversions, todayISO());

  for (var i = 0; i < STATE.licences.length; i++) {
    var L = STATE.licences[i], s = ov.statuses[i];

    var body;
    if (plan.done) {
      body = el("div", { "class": "kpi" }, "Done") +
        el("div", { "class": "note" }, "Required hours are logged. Check certificates and category minimums.");
    } else if (plan.achievable === false) {

    } else {
      body = el("div", { "class": "kpi " + (plan.perMonth > 12 ? "warn" : "") }, plan.perMonth + " h") +
        el("div", { "class": "note" },

  var byMonth = {};
  for (var j = 0; j < STATE.activities.length; j++) {

    if (!p) continue;
    byMonth[p] = round1((byMonth[p] || 0) + toClockHours(STATE.activities[j], STATE.conversions));

  var keys = Object.keys(byMonth).sort().reverse().slice(0, 12);

      el("span", { style: "font-size:12.5px" }, esc(keys[m])) +

      el("b", {}, byMonth[keys[m]] + "h"));

  return el("h2", {}, "Monthly Plan") +
    el("div", { "class": "sub" }, "The pace that finishes a month early, not the pace that finishes on the deadline.") +
    el("div", { "class": "grid g2" }, cards) +
    el("div", { style: "height:14px" }, "") +
    el("div", { "class": "card" },
      el("h3", {}, "Your last 12 months of PD") +
      (hist || el("div", { "class": "empty" }, "No activity logged yet")));

  else if (VIEW === "pd") html = viewPD();

function val(id) { var n = document.getElementById(id); return n ? n.value : ""; }

function download(name, text, type) {
  var blob = new Blob([text], { type: type || "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

document.addEventListener("click", function (ev) {
  var t = ev.target;
  var g = function (attr) {
    var n = t;
    while (n && n !== document) {
      if (n.getAttribute && n.getAttribute(attr) !== null) return n.getAttribute(attr);
      n = n.parentNode;
    }
    return null;
  };

  if (g("data-tab")) { VIEW = g("data-tab"); MODAL = null; EDIT = null; render(); return; }
  if (g("data-dark")) {
    STATE.settings.dark = STATE.settings.dark === "1" ? "0" : "1";
    document.documentElement.setAttribute("data-dark", STATE.settings.dark);
    save(); render(); return;
  }
  if (g("data-close") || (g("data-modal") && t.className === "modal")) { MODAL = null; EDIT = null; render(); return; }
  if (g("data-print")) { window.print(); return; }

  /* activities */
  if (g("data-new-a")) { MODAL = "activity"; EDIT = null; render(); return; }
  if (g("data-edit-a")) { MODAL = "activity"; EDIT = g("data-edit-a"); render(); return; }
  if (g("data-del-a")) {
    var ida = g("data-del-a");
    if (confirm("Delete this activity?")) {
      STATE.activities = STATE.activities.filter(function (x) { return x.id !== ida; });
      save(); render();
    }
    return;
  }
  if (g("data-save-a")) {
    var amt = num(val("aAmount"));
    if (amt <= 0) { alert("How much was awarded?"); return; }
    var boxes = document.querySelectorAll("[data-lic-check]");
    var lics = [];
    for (var b = 0; b < boxes.length; b++) {
      if (boxes[b].checked) lics.push(boxes[b].getAttribute("data-lic-check"));
    }
    if (!lics.length && STATE.licences.length) {
      if (!confirm("This activity is not assigned to any certificate, so it will not count. Save anyway?")) return;
    }
    var arec = { id: EDIT || uid(), date: val("aDate") || todayISO(), title: val("aTitle"),
                 category: val("aCat"), unit: val("aUnit"), amount: amt, provider: val("aProv"),
                 certificate: val("aCert"), submission: val("aSub"), licences: lics, notes: val("aNotes") };
    if (EDIT) { STATE.activities = STATE.activities.map(function (x) { return x.id === EDIT ? arec : x; }); }
    else { if(demoLimitReached()) return; STATE.activities.push(arec); }
    MODAL = null; EDIT = null; save(); render(); return;
  }

  /* licences */
  if (g("data-new-l")) { MODAL = "licence"; EDIT = null; render(); return; }
  if (g("data-edit-l")) { MODAL = "licence"; EDIT = g("data-edit-l"); render(); return; }
  if (g("data-del-l")) {
    var idl = g("data-del-l");
    if (confirm("Delete this certificate? Activities stay but lose this assignment.")) {
      STATE.licences = STATE.licences.filter(function (x) { return x.id !== idl; });
      for (var i = 0; i < STATE.activities.length; i++) {
        STATE.activities[i].licences = (STATE.activities[i].licences || []).filter(function (x) { return x !== idl; });
      }
      save(); render();
    }
    return;
  }
  if (g("data-save-l")) {
    var nm = val("lName").trim();
    if (!nm) { alert("Name this certificate."); return; }
    var existing = EDIT ? licenceById(EDIT) : null;
    var lrec = { id: EDIT || uid(), name: nm, state: val("lState"), number: val("lNumber"),
                 cycleStart: val("lCycleStart") || todayISO(),
                 cycleMonths: num(val("lCycleMonths")) || 60,
                 requiredHours: num(val("lRequired")), expiry: val("lExpiry"),
                 categoryMins: existing ? (existing.categoryMins || []) : [],
                 notes: val("lNotes") };
    if (EDIT) { STATE.licences = STATE.licences.map(function (x) { return x.id === EDIT ? lrec : x; }); }
    else { STATE.licences.push(lrec); }
    MODAL = null; EDIT = null; save(); render(); return;
  }

  /* category minimums */
  if (g("data-add-cm")) {
    var lid = g("data-add-cm");
    var L2 = licenceById(lid);
    if (!L2) return;
    var hours = num(val("cmh_" + lid));
    if (hours <= 0) { alert("How many hours are required in that category?"); return; }
    if (!L2.categoryMins) L2.categoryMins = [];
    L2.categoryMins.push({ category: val("cm_" + lid), hours: hours });
    save(); render(); return;
  }
  if (g("data-del-cm")) {
    var parts = g("data-del-cm").split("|");
    var L3 = licenceById(parts[0]);
    if (L3 && L3.categoryMins) { L3.categoryMins.splice(Number(parts[1]), 1); save(); render(); }
    return;
  }

  /* conversions + district */
  if (g("data-save-conv")) {
    STATE.conversions = {
      clockHour: num(val("cvClock")) || 1,
      ceu: num(val("cvCeu")),
      semesterCredit: num(val("cvSem")),
      quarterCredit: num(val("cvQtr"))
    };
    save(); render(); return;
  }
  if (g("data-save-district")) {
    STATE.district = {
      hrContact: val("dContact"), hrEmail: val("dEmail"), portal: val("dPortal"),
      deadline: val("dDeadline"), requirements: val("dReq"), notes: val("dNotes")
    };
    save(); render(); return;
  }

  /* export */
  if (g("data-export-json")) {
    download("teacher-pd-backup-" + todayISO() + ".json", JSON.stringify(STATE, null, 2));
    return;
  }
  if (g("data-export-csv")) {
    var rows = [["Date", "Activity", "Category", "Amount", "Unit", "Clock hours",
                 "Provider", "Certificate", "District status", "Counts toward", "Notes"]];
    var sorted = STATE.activities.slice().sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
    for (var i2 = 0; i2 < sorted.length; i2++) {
      var a2 = sorted[i2];
      var names = [];
      var ll = a2.licences || [];
      for (var j2 = 0; j2 < ll.length; j2++) names.push(licenceLabel(ll[j2]));
      rows.push([a2.date, a2.title || "", catLabel(a2.category), a2.amount, unitLabel(a2.unit),
        toClockHours(a2, STATE.conversions), a2.provider || "",
        a2.certificate === "1" ? "Yes" : "No", submissionLabel(a2.submission),
        names.join(" / "), a2.notes || ""]);
    }
    download("pd-log-" + todayISO() + ".csv", toCSV(rows), "text/csv");
    return;
  }
  if (g("data-reset")) {
    if (confirm("Clear everything and start empty? Export a backup first if you need one.")) {
      STATE = blank(); save(); VIEW = "dash"; render();
    }
    return;
  }
  if (g("data-import")) {
    var f = document.getElementById("importFile");
    if (f) f.click();
    return;
  }
});

document.addEventListener("change", function (ev) {
  var t = ev.target;
  if (t && t.getAttribute && t.getAttribute("data-pack-lic") !== null) {
    PACKLIC = t.value; render(); return;
  }
  if (t && t.id === "importFile" && t.files && t.files[0]) {
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var obj = JSON.parse(e.target.result);
        if (!obj || !obj.licences) throw new Error("bad file");
        STATE = obj;
        if (!STATE.settings) STATE.settings = { dark: "0" };
        if (!STATE.activities) STATE.activities = [];
        if (!STATE.conversions) STATE.conversions = blank().conversions;
        if (!STATE.district) STATE.district = blank().district;
        if (!STATE.profile) STATE.profile = blank().profile;
        save(); render();
      } catch (err) { alert("That file could not be read as a backup."); }
    };
    reader.readAsText(t.files[0]);
  }
});

load();
render();
</script>
</body></html>
